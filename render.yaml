services:
  - type: web
    name: conductor-backend
    env: node
    rootDir: backend-realtime
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: SESSION_SALT
        generateValue: true
      - key: MAX_CLIENT_DRIFT_MS
        value: 100
      - key: CONDUCTOR_HLS_BASE_URL
        value: https://media.letgofilm.com/test-shots-v1
      - key: CONDUCTOR_HLS_INTERSTITIAL_URL
        value: https://media.letgofilm.com/test-shots-v1/interstitial/interstitial.m3u8
      - key: CONDUCTOR_HLS_PRESHOW_URL
        value: https://media.letgofilm.com/test-shots-v1/preshow/preshow.m3u8
      - key: CONDUCTOR_HLS_INTRODUCTION_URL
        value: https://media.letgofilm.com/test-shots-v1/introduction/introduction.m3u8
      - key: CONDUCTOR_HLS_ENDING_URL
        value: https://media.letgofilm.com/test-shots-v1/ending/ending.m3u8
      - key: REDIS_URL
        sync: false
      - key: POSTGRES_URL
        sync: false

  - type: web
    name: conductor-web
    env: static
    rootDir: web-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_BACKEND_HOST
        value: letgo-fe0a.onrender.com
