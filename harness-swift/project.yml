name: ConductorHarnessApp
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
packages:
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    from: 1.1.0
targets:
  ConductorCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/ConductorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letgo.conductor.core
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
  ConductorHarnessApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ConductorHarnessApp
      - path: Sources/ConductorHarnessApp/Resources
        buildPhase: resources
      - path: letgo.icon
        buildPhase: resources
    dependencies:
      - target: ConductorCore
      - package: swift-collections
        product: Collections
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: letgo
        PRODUCT_BUNDLE_IDENTIFIER: com.letgo.conductor.harness
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "Letgo"
        INFOPLIST_KEY_ATSApplicationFontsPath: .
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  ConductorHarnessApp:
    build:
      targets:
        ConductorHarnessApp: all
    run:
      config: Debug
    archive:
      config: Release
